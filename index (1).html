<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR เครื่องโม่ปูน - Hiro Marker</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, "Noto Sans Thai", sans-serif;
      background: #000;
    }

    #statusTop {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      width: max-content;
      max-width: 92%;
      padding: 10px 18px;
      color: #fff;
      background: rgba(0,0,0,.72);
      border-radius: 22px;
      font-size: 14px;
      text-align: center;
      transition: .25s;
    }

    #panel {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      z-index: 9999;
      width: min(94%, 520px);
      padding: 15px;
      color: #fff;
      background: rgba(17,17,17,.88);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,.45);
    }

    #panel h2 {
      margin: 0 0 12px;
      font-size: 20px;
      text-align: center;
    }

    .speedGrid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 6px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      background: #333;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(.96);
    }

    button.active {
      background: #f39c12;
      box-shadow: 0 0 15px rgba(243,156,18,.55);
    }

    #lidBtn {
      width: 100%;
      margin-top: 9px;
      background: #27ae60;
    }

    #info {
      margin-top: 9px;
      text-align: center;
      font-size: 14px;
      color: #ddd;
    }

    #hint {
      margin-top: 5px;
      text-align: center;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div id="statusTop">🎯 ส่องกล้องไปที่ Hiro Marker</div>

  <div id="panel">
    <h2>🏗️ เครื่องโม่ปูน AR</h2>

    <div class="speedGrid">
      <button id="stopBtn" class="active">STOP</button>
      <button id="slowBtn">ช้า</button>
      <button id="mediumBtn">กลาง</button>
      <button id="fastBtn">เร็ว</button>
    </div>

    <button id="lidBtn">🔓 เปิดฝาถัง</button>

    <div id="info">ความเร็วถัง: หยุด</div>
    <div id="hint">ส่อง Hiro Marker เพื่อดูเครื่องโม่ปูน</div>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled:false"
    renderer="antialias:true; alpha:true; colorManagement:true"
    arjs="sourceType:webcam; debugUIEnabled:false; trackingMethod:best;"
  >

    <!-- แสง -->
    <a-entity light="type:ambient;color:#ffffff;intensity:1.3"></a-entity>
    <a-entity light="type:directional;color:#ffffff;intensity:1.7"
              position="2 4 3"></a-entity>

    <!-- HIRO MARKER -->
    <a-marker id="hiroMarker" preset="hiro">

      <!-- เครื่องโม่ปูน -->
      <a-entity id="mixer" position="0 0 0" scale=".75 .75 .75">

        <!-- ฐาน -->
        <a-box
          position="0 .25 0"
          width="2.5"
          height=".35"
          depth="1.35"
          color="#30343b">
        </a-box>

        <!-- คานฐาน -->
        <a-box position="-.85 .52 0" width=".22" height=".8" depth=".85" color="#4a4f55"></a-box>
        <a-box position=".85 .52 0" width=".22" height=".8" depth=".85" color="#4a4f55"></a-box>

        <!-- ล้อหลัง -->
        <a-cylinder
          position="-.92 .2 .58"
          radius=".23"
          height=".16"
          rotation="90 0 0"
          color="#17191c">
        </a-cylinder>

        <a-cylinder
          position=".92 .2 .58"
          radius=".23"
          height=".16"
          rotation="90 0 0"
          color="#17191c">
        </a-cylinder>

        <!-- ขา -->
        <a-box position="-.82 .68 0" width=".18" height=".75" depth=".18" color="#565b60"></a-box>
        <a-box position=".82 .68 0" width=".18" height=".75" depth=".18" color="#565b60"></a-box>

        <!-- แกนหลัก -->
        <a-cylinder
          position="0 1.05 0"
          radius=".14"
          height="1.7"
          rotation="0 0 90"
          color="#555b60">
        </a-cylinder>

        <!-- ชุดถังโม่ -->
        <a-entity
          id="drumAssembly"
          position="0 1.35 0"
          rotation="0 0 0">

          <!-- ถังโม่ทรงกระบอกเอียง -->
          <a-cylinder
            id="drum"
            position="0 0 0"
            radius=".78"
            height="1.45"
            rotation="0 0 90"
            color="#d88910"
            material="roughness:.45;metalness:.2">
          </a-cylinder>

          <!-- วงแหวนขอบถัง -->
          <a-torus
            position="-.73 0 0"
            rotation="0 90 0"
            radius=".68"
            radius-tubular=".08"
            color="#5d6267">
          </a-torus>

          <a-torus
            position=".73 0 0"
            rotation="0 90 0"
            radius=".68"
            radius-tubular=".08"
            color="#5d6267">
          </a-torus>

          <!-- ครีบด้านใน/ภายนอกของถัง -->
          <a-box
            position="0 .62 .55"
            width="1.15"
            height=".11"
            depth=".12"
            color="#f2a51a">
          </a-box>

          <a-box
            position="0 -.62 .55"
            width="1.15"
            height=".11"
            depth=".12"
            color="#f2a51a">
          </a-box>

          <!-- แกนกลางในถัง -->
          <a-cylinder
            position="0 0 0"
            radius=".12"
            height="1.5"
            rotation="0 0 90"
            color="#777d82">
          </a-cylinder>

          <!-- ฝาปากถัง -->
          <a-entity id="lidAssembly"
                    position="-.79 0 0"
                    rotation="0 0 0">

            <a-cylinder
              radius=".62"
              height=".13"
              rotation="0 90 0"
              color="#555b60">
            </a-cylinder>

            <a-cylinder
              radius=".49"
              height=".14"
              rotation="0 90 0"
              color="#d88910">
            </a-cylinder>

            <!-- มือจับฝา -->
            <a-box
              position="-.08 0 0"
              width=".08"
              height=".18"
              depth=".55"
              color="#222629">
            </a-box>
          </a-entity>

        </a-entity>

        <!-- มือหมุน/เฟืองด้านข้าง -->
        <a-cylinder
          position=".88 1.35 0"
          radius=".38"
          height=".12"
          rotation="0 90 0"
          color="#292d31">
        </a-cylinder>

        <a-torus
          position=".95 1.35 0"
          rotation="0 90 0"
          radius=".25"
          radius-tubular=".045"
          color="#8a8f94">
        </a-torus>

        <!-- ชุดมอเตอร์ -->
        <a-box
          position="0 .72 .72"
          width=".75"
          height=".42"
          depth=".45"
          color="#24282c">
        </a-box>

        <a-cylinder
          position="-.45 .72 .75"
          radius=".18"
          height=".2"
          rotation="90 0 0"
          color="#d88910">
        </a-cylinder>

        <!-- มือจับฐาน -->
        <a-box
          position="0 .5 -.7"
          width="1.2"
          height=".12"
          depth=".12"
          color="#5b6065">
        </a-box>

      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

<script>
  const drumAssembly = document.getElementById("drumAssembly");
  const lidAssembly = document.getElementById("lidAssembly");

  const stopBtn = document.getElementById("stopBtn");
  const slowBtn = document.getElementById("slowBtn");
  const mediumBtn = document.getElementById("mediumBtn");
  const fastBtn = document.getElementById("fastBtn");
  const lidBtn = document.getElementById("lidBtn");

  const info = document.getElementById("info");
  const statusTop = document.getElementById("statusTop");
  const hiroMarker = document.getElementById("hiroMarker");

  let speed = 0;
  let lidOpen = false;

  /*
    ความเร็ว:
    STOP = 0
    ช้า = 0.5
    กลาง = 1.5
    เร็ว = 3.5
  */
  function setSpeed(value, label, selectedButton) {
    speed = value;

    document.querySelectorAll(".speedGrid button")
      .forEach(btn => btn.classList.remove("active"));

    selectedButton.classList.add("active");
    info.textContent = "ความเร็วถัง: " + label;
  }

  stopBtn.addEventListener("click", () => {
    setSpeed(0, "หยุด", stopBtn);
  });

  slowBtn.addEventListener("click", () => {
    setSpeed(.5, "ช้า", slowBtn);
  });

  mediumBtn.addEventListener("click", () => {
    setSpeed(1.5, "กลาง", mediumBtn);
  });

  fastBtn.addEventListener("click", () => {
    setSpeed(3.5, "เร็ว", fastBtn);
  });

  /*
    หมุนถังโม่
    ใช้ requestAnimationFrame เพื่อให้การหมุนลื่น
  */
  let lastTime = performance.now();

  function animateMixer(now) {
    const delta = (now - lastTime) / 16.67;
    lastTime = now;

    if (speed !== 0) {
      const rotation = drumAssembly.getAttribute("rotation");
      rotation.y += speed * delta;
      drumAssembly.setAttribute("rotation", rotation);
    }

    requestAnimationFrame(animateMixer);
  }

  requestAnimationFrame(animateMixer);

  /*
    เปิด / ปิดฝาถัง
  */
  lidBtn.addEventListener("click", () => {
    lidOpen = !lidOpen;

    if (lidOpen) {
      lidBtn.textContent = "🔒 ปิดฝาถัง";
      lidBtn.style.background = "#e74c3c";

      lidAssembly.setAttribute(
        "animation",
        "property: rotation; to: 0 0 -75; dur:700; easing:easeOutCubic"
      );
    } else {
      lidBtn.textContent = "🔓 เปิดฝาถัง";
      lidBtn.style.background = "#27ae60";

      lidAssembly.setAttribute(
        "animation",
        "property: rotation; to: 0 0 0; dur:700; easing:easeOutCubic"
      );
    }
  });

  /*
    ตรวจจับ Hiro Marker
  */
  hiroMarker.addEventListener("markerFound", () => {
    statusTop.textContent = "✅ พบ Hiro Marker — เครื่องโม่ปูนพร้อมใช้งาน";
    statusTop.style.background = "rgba(25,135,84,.88)";
  });

  hiroMarker.addEventListener("markerLost", () => {
    statusTop.textContent = "🎯 ส่องกล้องไปที่ Hiro Marker";
    statusTop.style.background = "rgba(0,0,0,.72)";
  });
</script>

</body>
</html>
